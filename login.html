<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Personal Finance App</title>
  <meta name="theme-color" content="#201F24">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <a href="#login-form" class="skip-link">Skip to login form</a>

  <main class="auth-shell">
    <section class="auth-visual" aria-label="Personal finance app">
      <a class="auth-logo" href="index.html">
        <img src="./assets/images/logo-large.svg" alt="finance" width="122" height="22">
      </a>
      <img src="./assets/images/illustration-authentication.svg" alt="" aria-hidden="true">
      <div>
        <h1>Keep track of your money and save for your future</h1>
        <p>Personal finance app puts your transactions, budgets, pots, and recurring bills in one place.</p>
      </div>
    </section>

    <section class="auth-card" aria-labelledby="login-heading">
      <div>
        <p class="eyebrow">Welcome back</p>
        <h2 id="login-heading">Login</h2>
      </div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6">
          <p class="hint">Any password with at least 6 characters works in this demo.</p>
        </div>

        <p class="form-error" id="login-error" role="alert" hidden></p>
        <button class="btn btn--primary btn--lg" type="submit">Login</button>
      </form>
    </section>
  </main>

  <script type="module" src="./src/login.js"></script>
</body>
</html>
